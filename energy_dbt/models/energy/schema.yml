version: 2

models:
  - name: enriched_capacity
    description: "Municipality capacity data enriched with region names and renewable percentage"
    columns:
      - name: MunicipalityNo
        tests:
          - not_null
          - accepted_values:
              values: [101, 147, 151, 153, 155, 157, 159, 161, 163, 165, 167, 169, 173, 175, 183, 185, 187, 190, 
              201, 210, 217, 219, 223, 230, 240, 250, 253, 259, 260, 265, 269, 270, 
              306, 316, 320, 326, 329, 330, 336, 340, 350, 360, 370, 376, 390, 
              400, 410, 411, 420, 430, 440, 450, 461, 479, 480, 482, 492, 
              510, 530, 540, 550, 561, 563, 573, 575, 580,  
              607, 615, 621, 630, 657, 661, 665, 671, 
              706, 707, 710, 727, 730, 740, 741, 746, 751, 756, 760, 766, 773, 779, 787, 791, 
              810, 813, 820, 825, 840, 846, 849, 851, 860]   
      - name: Month
        tests:
          - not_null
      - name: renewable_percentage
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: region_name
        tests:
          - not_null
          - accepted_values:
              values: ['Capital Region', 'Central Denmark', 'North Denmark', 'Zealand Region', 
              'Southern Denmark']
    
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - MunicipalityNo
            - Month